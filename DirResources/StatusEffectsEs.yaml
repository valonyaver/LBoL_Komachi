  Name: Desplazamiento
  Description: 'Al comienzo del turno de {PlayerName}, si {Level:plural one=''no hay''
    other=''hay menos de %''} |¡Mover!| en la mano, agrega {Level:plural one=''un |¡Mover!|'' other=''|Mover!|''} a la mano{Level:plural one=''.'' other='' hasta
    que haya %.''}'

KomachiModBossTempFirepowerSe:
  Name: Poder Temporal Inminente
  Description: |-
    Al comienzo de la ronda, {OwnerName} gana {Level} de |Poder Temporal|.

KomachiModBossGuidedEndTurnSe:
  Name: Ganar Espíritus Guiados
  Description: |-
    Al final del turno de {OwnerName}, gana {Level} |Espíritus Guiados|.

KomachiModBossReviveSe:
  Name: Diosa de la Muerte
  Description: |-
    {OwnerName} es una shinigami. Usará sus poderes para manipular la distancia del combate según su próxima intención.
  ExtraDescription: |-
    ¡{OwnerName} ha burlado temporalmente a la muerte usando sus poderes de Shinigami!
    En este turno será su último acto de resistencia antes de retirarse del combate.
    
#Keywords

KomachiDistanceKeyword:
  Name: Distancia
  Brief: |-
    La distancia es un efecto de estado que se aplica a los enemigos y representa su proximidad al jugador.
    Cuanto más cerca esté un enemigo, más daño infligirá y recibirá. Cuanto más lejos esté, menos daño infligirá y recibirá.

    Hay 5 niveles de distancia (el valor predeterminado es 3 si no se aplica ningún estado):
    - Muy Cerca (1): Inflige y recibe +100% de daño por ataques.
    - Cerca (2): Inflige y recibe +50% de daño por ataques.
    - Normal (3): Sin modificador de daño (por defecto).
    - Lejos (4): Inflige y recibe -15% de daño por ataques.
    - Muy Lejos (5): Inflige y recibe -30% de daño por ataques.

KomachiDisplacementKeyword:
  Name: Desplazar X
  Brief: |-
    Cambia la |Distancia| actual del objetivo en X. Los enemigos sin distancia tienen su distancia tratada como 3
    El desplazamiento también se refiere en general a cualquier instancia de cambio de distancia de un enemigo.

KomachiDetonationKeyword:
  Name: Detonar
  Brief: |-
    Remueve los |Espíritus Vengativos| del enemigo y le inflige daño.

KomachiModReleaseKeyword:
  Name: Liberar X
  Brief: |-
    Remueve X cantidad de |Espíritus Guiados| y/o |Espíritus Divinos| de {PlayerName} al jugar* esta carta para activar opcionalmente este efecto.
    Los |Espíritus Guiados| tienen prioridad primero.
    *Debes tener la cantidad requerida antes de jugar la carta.
    
KomachiAutoDiscardKeyword:
  Name: Auto-Descarte
  Brief: |-
    Cuando estés a punto de *llenar* la mano, |Descarta| esta carta.
    La carta más a la izquierda de la mano con |Auto-Descarte| se |Descarta| primero.
    *<i>Debido a las limitaciones del mod, esto funciona de forma diferente al autoexilio, donde el descarte ocurre al completar la mano en lugar de al excederla.
