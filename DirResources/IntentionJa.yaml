KomachiBossDisplaceIntention:
  Name: 変位
  Description: |-
    {OwnerName}は位置を不明な距離だけずらそうとしている。
  PositiveDisplacementDescription: |-
    {OwnerName}は位置を前方に{displacementAmount}だけずらそうとしている。
  NegativeDisplacementDescription: |-
    {OwnerName}は位置を後方に{displacementAmount}だけずらそうとしている。

KomachiBossDistanceTaxIntention:
  Name: 距離税デバフ
  Description: |-
    {OwnerName}は{PlayerName}に|不利な効果|をかけようとしている。
    その効果は{OwnerName}と{PlayerName}の距離に応じて変化する。