KomachiModUltA:
  Title: Shinigami
  Content: Higan Retour
  Description: |-
    |Displace| all enemies to have {Value1} |Distance|.
    Add a |Manipulate Distance| to your hand for each enemy.
    Deal {Damage} damage to each enemy. |Accurate|

KomachiModUltB:
  Title: Spirit Sign
  Content: Awakening of the Ancient Earthbound Spirits
  Description: |-
    Remove all |Amulets| from each enemy.
    Apply {Value1} |Vengeful Spirits| on each enemy.
    |Detonate| each enemy.
    Gain |Divine Spirits| equal to the amount of detonated |Vengeful Spirits|.

KomachiModUltHalfLife:
  Title: Poor Fate
  Content: Shot Life Expectancy - Your Days Are Numbered
  Description: |-
    Halve the enemy's current life.

KomachiModUltShootGhosts:
  Title: Soul Sign
  Content: Scythe of Roaming Spirits
  Description: |-
    Deal {Damage} damage. {SelfName} deals {Value1} more damage for every |Vengeful Spirit| on the target.
    If the target is defeated, apply |Vengeful Spirits| equal to the amount that enemy had on each other enemy.

KomachiModUltFinalJudgement:
  Title: Death Sign
  Content: Scythe of Final Judgement
  Description: |-
    |Displace| to any distance.
    Deal {Damage} damage. Damage reduction of far distances increases this card's damage by double the amount instead.
    When an enemy is defeated using {SelfName}, add a |Spider Lily| to the hand.