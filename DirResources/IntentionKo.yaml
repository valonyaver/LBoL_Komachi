KomachiBossDisplaceIntention:
  Name: 위치 변경
  Description: |-
    {OwnerName}가 위치를 알 수 없는 만큼 이동하려 합니다.
  PositiveDisplacementDescription: |-
    {OwnerName}가 위치를 {displacementAmount}만큼 이동하려 합니다.
  NegativeDisplacementDescription: |-
    {OwnerName}가 위치를 {displacementAmount}만큼 이동하려 합니다.

KomachiBossDistanceTaxIntention:
  Name: 거리세 약화
  Description: |-
    {OwnerName}이 {PlayerName}에게 |부정적 효과|를 부여하려 합니다.
    이 |부정적 효과|는 {OwnerName}과 {PlayerName} 사이의 |거리|에 따라 달라집니다.