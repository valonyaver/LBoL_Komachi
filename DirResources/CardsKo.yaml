    (사실 진심은 아님)"

KomachiModRetreat:
  Name: 손쉬운 후퇴
  Description: |-
    {Value1} |이동|시킬 수 있습니다.
    |방어|를 {Block} 얻습니다.
    대상의 |거리|가 {Value3}일 경우 |거리 조작|을 한 장 손에 넣습니다.
  UpgradedDescription: |-
    {Value1} |이동|시킬 수 있습니다. 이후 다른 적 모두를 {Value2} |이동|시킬 수 있습니다.
    |방어|를 {Block} 얻습니다.
    대상의 |거리|가 {Value3}일 경우 |거리 조작|을 한 장 손에 넣습니다.
  ExtraDescription1: 대상을 |이동|시키지 않음.
  ExtraDescription2: 다른 적들을 |이동|시키지 않음.

KomachiModEndlessWay:
  Name: 끝없는 여로
  Description: |-
    {Value1} |이동|시킨 후, 해당 적의 |그레이즈|를 제거합니다.
    |방어|를 {Block} 얻습니다.
    |해방| {Value2} 또는 {Value3}: {Value2}개의 영혼을 |해방|하면 |록온| {lockOnAmount} 부여.
  ExtraDescription1: |-
    |해방| {Value2}: |록온| {lockOnAmount} 부여.
  ExtraDescription2: |-
    |해방| {Value3}: |록온| {lockOnAmount2} 부여.

KomachiModSweep:
  Name: 쓸어내리는 낫
  Description: |-
    모든 적을 -{Value1} |이동|시킵니다.
    모든 적에게 피해를 {Damage} 줍니다.
    |거리 조작|을 {Value2}장 손에 넣습니다.

KomachiModDistanceTax:
  Name: 거리세
  Description: |-
    각 적의 |거리|에 따라 다음 효과를 줍니다:
    1–2: |허약| {Value1}
    3: |록온| {Value2}, |일시 화력 저하| {Value2}
    4–5: |취약| {Value3}

KomachiModTasteOfDeath:
  Name: 죽음의 맛
  Description: |-
    -{Value1} |이동|.
    피해를 {Damage} 줍니다.

KomachiModPushDraw:
  Name: 밀치고 뽑기
  Description: |-
    {Value1} |이동|시킬 수 있습니다.
    대상 적의 |거리|만큼 카드를 뽑습니다.
  UpgradedDescription: |-
    최대 {Value1} |이동|시킬 수 있습니다.
    대상 적의 |거리|만큼 카드를 뽑습니다.
  ExtraDescription1: "이동하지 않음."

KomachiModQuickNap:
  Name: 짧은 낮잠
  Description: |-
    체력을 {Value1} 회복합니다.  
    다음 턴 시작 시 {Mana}를 얻습니다.  
    {PlayerName}의 턴을 종료합니다.

KomachiModDistanceAttack:
  Name: 사신의 낫
  Description: |-
    피해를 {Damage} 줍니다.  
    적의 |거리|가 변경될 때마다 버린 카드 더미에 있는 {SelfName}을 손으로 되돌립니다.

KomachiModScytheFinalJudgment:
  Name: 최후의 판결의 낫
  Description: |-
    원하는 거리로 |이동|합니다.  
    피해를 {Damage} 줍니다.  
    먼 거리로 인한 피해 감소는 이 카드에 한해 두 배의 피해 증가로 전환됩니다.  
    이 카드로 적을 처치하면 |피안화|를 손에 넣습니다.
  UpgradedDescription: |-
    원하는 거리로 |이동|합니다.  
    피해를 {Damage} 줍니다.  
    먼 거리로 인한 피해 감소는 이 카드에 한해 두 배의 피해 증가로 전환됩니다.  
    이 카드로 적을 처치하면 |피안화|를 2장 손에 넣습니다.

KomachiModShinigamiFinesse:
  Name: 사신의 기량
  Description: |-
    피해를 {Damage}씩 {attackAmount}번 가합니다.  
    이 카드의 공격 횟수는 대상의 |거리| 단계와 같습니다.  
    대상의 거리 단계가 {three} 미만이면, 이 공격은 |명중|으로 처리됩니다.

KomachiModDistanceBlock:
  Name: 유연한 근무 시간표
  Description: |-
    적이 |이동|될 때마다, 거리 변화 수치 1단계당 |방어|를 {Value1} 얻습니다.

KomachiModDistanceGenerator:
  Name: 근면한 사신
  Description: |-
    {PlayerName}의 턴 시작 시 손에 |거리 조작|이 없다면  
    |거리 조작|을 {Value1}장 손에 넣습니다.
  UpgradedDescription: |-
    |거리 조작| 1장을 손에 넣습니다.  
    이후 {PlayerName}의 턴 시작 시 손에 |거리 조작|이 없다면  
    |거리 조작|을 {Value1}장 손에 넣습니다.

KomachiModDistanceFlow:
  Name: 삼도천의 흐름
  Description: |-
    적이 |이동|될 때마다:  
    - 거리가 증가했으면 |일시 영력| {Value1} 획득  
    - 거리가 감소했으면 |일시 화력| {Value1} 획득

KomachiModPushNPull:
  Name: 밀고 당기기
  Description: |-
    {PlayerName}의 턴 시작 시 모든 적을 -{Value1} |이동|시킵니다.  
    턴 종료 시, 모든 적을 다시 {Value1} |이동|시킵니다.
  UpgradedDescription: |-
    |거리 조작|을 손에 1장 넣습니다.  
    {PlayerName}의 턴 시작 시 모든 적을 -{Value1} |이동|시킵니다.  
    턴 종료 시, 모든 적을 다시 {Value1} |이동|시킵니다.

KomachiModReviveCard:
  Name: 죽음의 신
  Description: |-
    이번 전투에서 {PlayerName}가 쓰러질 경우 한 번에 한해  
    최대 체력의 절반만큼 회복하고 |천의무봉|을 {Value2} 얻습니다.  
    이 효과가 발동되면 {SelfName}은 덱에서 제거됩니다.  
    적을 처치할 때, 그것이 소환된 적이였다면 |보호막|을 {Value1}, 아니면 체력을 {Value1} 회복합니다.
  DetailText: "{SelfName}은 전투 중 무작위로 등장하지 않으며 복사될 수 없습니다."

KomachiModRiversideGarden:
  Name: 강가의 정원
  Description: |-
    |피안화|를 손, 뽑을 카드 더미, 버린 카드 더미에 각각 {Value1}장 추가합니다.  
    이 전투 중 |피안화|를 손에 넣을 때마다 |강화|됩니다.  
    전투 종료 시 전장에 남아 있는 |피안화| 1장당 체력을 {Value2} 회복합니다.

KomachiModShinigamiTactics:
  Name: 사신 전술
  Description: |-
    |거리 조작|을 사용할 때:  
    - 거리를 줄였다면 무작위 공격 카드를 손에 1장 추가  
    - 거리를 늘렸다다면 무작위 방어 카드를 손에 1장 추가  
    해당 카드는 |일시적으로| 코스트가 {Mana}가 되고, |소멸|과 |휘발성|을 가집니다.  
    또한 |거리 조작|을 {Value2}장 손에 넣습니다.

KomachiModLowTierShinigami:
  Name: 하급 사신
  Description: |-
    피해를 {Damage} 줍니다.  
    |취약| {Value1} 부여.
  FlavorText: "몇 번이나 말해야 알아들어? 네가 죽든 말든 아무도 신경 안 써."

KomachiModWeedCutter:
  Name: 잡초 제거기
  Description: |-
    피해를 {Damage} 줍니다.  
    카드를 {Value1}장 뽑습니다.  
    |거리 조작|을 손에 1장 넣습니다.

KomachiModParry:
  Name: 낫으로 받아내기
  Description: |-
    |방어|를 {Block} 얻습니다.  
    |반사|를 {Value1} 얻습니다.  
    |거리 조작|을 1장 손에 넣습니다.

KomachiModCoinThrow:
  Name: 동전 던지기
  Description: |-
    모든 적에게 피해를 {Damage} 줍니다.  
    <sprite="Point" name="Gold">를 {Value1} 잃습니다.

KomachiModIgnoreNagging:
  Name: 잔소리 무시
  Description: |-
    -{Value1} |이동|합니다.  
    |거리|가 1 또는 2인 적마다 |그레이즈|를 {Value2} 얻습니다.
  UpgradedDescription: |-
    최대 {Value1} |이동|합니다.  
    |거리|가 1 또는 2인 적마다 |그레이즈|를 {Value2} 얻습니다.

KomachiModRetreatBoat:
  Name: 보호의 삼도선
  Description: |-
    {Value1} |이동|합니다.  
    |방어|를 {Block} 얻습니다.  
    대상의 |거리| × {Value2}만큼 |보호막|을 얻습니다.

KomachiModManipDefence:
  Name: 이동식 방어
  Description: |-
    |방어|를 {Block} 얻습니다.  
    |거리|가 {Value1} 이상인 적마다 |거리 조작|을 1장 손에 넣습니다.

KomachiModWorkFocus:
  Name: 업무 집중
  Description: |-
    손패에서 최대 {Value1}장까지 |소멸|시키고, 그 수만큼 |거리 조작|을 손에 넣습니다.  
    이때 강화된 카드를 소멸했다면 |피안화|를 1장 손에 넣습니다.
  UpgradedDescription: |-
    손패, 뽑을 카드 더미, 버린 카드 더미에서 최대 {Value1}장을 |소멸|하고, 그 수만큼 |거리 조작|을 손에 넣습니다.  
    이때 강화된 카드를 소멸했다면 |피안화|를 1장 손에 넣습니다.

KomachiModSpySpirit:
  Name: 따라다니는 첩자령
  Description: |-
    피해를 {Damage} 줍니다.  
    해당 적이 |이동|할 때마다 |보호막|을 {Value1} 얻습니다.

KomachiModSliceOfHigan:
  Name: 피안 베기
  Description: |-
    피해를 {Damage}씩 {Value1}회 가합니다.  
    |손패에 있을 때|: 적이 |이동|할 때마다, 이동한 단계 수만큼 이번 전투에서 이 카드의 피해가 {Value2} 증가합니다.

KomachiModEqualizeDistance:
  Name: 거리 평준화
  Description: |-
    |거리|가 3이 될 때까지 |이동|합니다.  
    이동한 단계마다 카드를 {Value1}장 뽑습니다.  
    대상의 |거리|가 이미 3이라면, 카드를 {Value2}장 뽑고 {Value3}장 버립니다.

KomachiModRitualOfEcstasy:
  Name: 도취의 의식
  Description: |-
    대상의 |거리|를 반전시키고, 다음 효과 중 하나를 줍니다.  
    거리 단계가 3이라면 효과를 선택할 수 있습니다.  
    거리가 감소했으면 카드를 {Value1}장 뽑고,  
    거리가 증가했으면 |그레이즈| {Value2}, |방어| {Block}을 얻습니다.
  ExtraDescription1: |-
    카드를 {Value1}장 뽑습니다.
  ExtraDescription2: |-
    |그레이즈| {Value2}, |방어| {Block}을 얻습니다.
  DetailText: |-
    거리를 3을 기준으로 반전시킵니다. 예:  
    - 거리 1 → 5  
    - 거리 2 → 4  
    - 거리 3 → 변화 없음  
    - 거리 4 → 2  
    - 거리 5 → 1

KomachiModExchangeLife:
  Name: 생명 교환
  Description: |-
    대상의 현재 체력이 {PlayerName}의 최대 체력 이하라면, 서로의 현재 체력을 교환합니다.  
    이 카드로 {PlayerName}가 회복되면, 전투와 덱에서 제거됩니다.  
    |충원|: {PlentifulMana}를 얻습니다.
  DetailText: |-
    체력이 낮은 쪽은 회복되고, 높은 쪽은 체력을 잃습니다.  
    {SelfName}은 전투 중 무작위로 등장하지 않으며 복사될 수 없습니다.

KomachiModGrudgingStrike:
  Name: 원한의 일격
  Description: |-
    피해를 {Damage} 줍니다.  
    |원령| {Value1}을 줍니다.  
    |해방| {Value2}: |기폭| 카드를 손에 넣습니다.
  ExtraDescription1: |-
    |해방| {Value2}: |기폭| 카드를 손에 넣습니다.

KomachiModDefendDetonate:
  Name: 섭섭한 건 아니야
  Description: |-
    |방어|를 {Block} 얻습니다.  
    대상에게 |기폭|을 선택할 수 있습니다. 그렇게 하면, 그 대상이 가진 |원령| {Value3}마다 |일시 화력 저하|를 {Value2} 줍니다.
