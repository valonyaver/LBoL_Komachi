KomachiModScytheFinalJudgment:
  Name: 최후의 판결의 낫
  Description: |-
    원하는 거리로 |이동|합니다.  
    모든 적에게 피해를 {Damage} 줍니다.  
    먼 거리로 인한 피해 감소는 이 카드에 한해 두 배의 피해 증가로 전환됩니다.  
    이 카드로 적을 처치하면 |피안화|를 손에 넣습니다.
  UpgradedDescription: |-
    원하는 거리로 |이동|합니다.  
    모든 적에게 피해를 {Damage} 줍니다.  
    먼 거리로 인한 피해 감소는 이 카드에 한해 두 배의 피해 증가로 전환됩니다.  
    이 카드로 적을 처치하면 |피안화|를 2장 손에 넣습니다.
  ExtraDescription1: |-
    해당 적에게 피해를 VALUE 줍니다.
  DetailText: |-
    이 카드의 피해는 거리 4에서 30%, 거리 5에서 60% 증가합니다.
    피해는 적마다 개별적으로 계산됩니다.

KomachiModShinigamiFinesse:
