KomachiModReviveCard:
  Name: 죽음의 신
  Description: |-
    이번 전투에서 {PlayerName}가 쓰러질 경우 한 번에 한해  
    최대 체력의 절반만큼 회복하고 |천의무봉|을 {Value2} 얻습니다.  
    이 효과가 발동되면 {SelfName}은 덱에서 제거됩니다.  
    적을 처치할 때, 그것이 소환된 적이였다면 |보호막|을 {Value1}, 아니면 체력을 {Value1} 회복합니다.
  DetailText: |-
