    이동한 단계마다 카드를 {Value1}장 뽑습니다.  
    대상의 |거리|가 이미 3이라면, 카드를 {Value2}장 뽑고 {Value3}장 버립니다.

KomachiModRitualOfEcstasy:
  Name: 도취의 의식
  Description: |-
    대상의 |거리|를 반전시키고, 다음 효과 중 하나를 줍니다.  
    거리 단계가 3이라면 효과를 선택할 수 있습니다.  
    거리가 감소했으면 카드를 {Value1}장 뽑고,  
    거리가 증가했으면 |그레이즈| {Value2}, |방어| {Block}을 얻습니다.
  ExtraDescription1: |-
    카드를 {Value1}장 뽑습니다.
  ExtraDescription2: |-
    |그레이즈| {Value2}, |방어| {Block}을 얻습니다.
  DetailText: |-
    거리를 3을 기준으로 반전시킵니다. 예:  
    - 거리 1 → 5  
    - 거리 2 → 4  
    - 거리 3 → 변화 없음  
    - 거리 4 → 2  
    - 거리 5 → 1

