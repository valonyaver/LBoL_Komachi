    {PlayerName}의 턴을 종료합니다. 그 후 추가 턴을 가집니다.
    이 추가 턴에서는 |방어|를 잃지 않습니다.
    |그 추가 턴 시작 시|: 카드를 {Value2}장 뽑고, {Mana}를 얻으며, |화력|을 {Value2} 얻습니다.
    |턴 종료 시|: 피해를 {Value1} 받습니다.

KomachiModGoldSarcophagus:
  Name: 황금 관선
  Description: |-
    뽑을 카드 더미에서 카드 1장을 선택해 |소멸|시킵니다.
    이 카드를 사용한 후 두 번째 턴 시작 시, 해당 카드를 손에 넣고 |강화|합니다.

KomachiModExileDoppelganger:
  Name: 삼도천의 멸종된 생물
  Description: |-
    {PlayerName}가 카드를 사용할 때마다:
    - |같은 이름의 카드가 소멸 구역에 없다면|: 해당 카드의 |복사본|을 소멸구역으로 보냅니다. 해당 카드의 비용은 {Mana}만큼 감소하고 사용 시 전투에서 제거됩니다.
    - |같은 이름의 카드가 소멸 구역에 있다면|: 그것을 손에 넣을 수 있습니다.
    {SelfName}의 각 효과는 턴마다 한 번씩만 사용할 수 있습니다.
  DetailText: |-
    복사된 카드는 첫 번째 효과로 다시 복사할 수 없습니다.

KomachiModSpiritDraw:
  Name: 저승길 안내인
  Description: |-
    카드를 {draw}장 뽑습니다.
    이 방식으로 뽑은 카드 중 일반 카드는 적 전체에 |원령|을 {Value1} 주고, 특수 카드는 |인도된 영혼|을 {Value2} 얻으며, 희귀 카드는 |신령| {Value3} 얻습니다.
  FlavorText: |-
    체인 1 몽아몽중 → 성급한 매장 대상 지정. 체인 2 성급한 매장 → 몽아몽중 대상 지정.

KomachiModEiki:
  Name: 시키에이키 야마자나두, 낙원의 대심판자
  Description: |-
    {Indent}|신령|을 {RawShield} 얻습니다.
    {PassiveCostIcon}손에 있는 무작위 카드 {Value1}장을 선택합니다: |그것이 액운 또는 상태 카드일 경우|: |소멸|시키고 |인도된 영혼|을 {Value2} 얻습니다. 
    |그 외일 경우|: 마나 비용만큼 |인도된 영혼|를 얻고, 비용이 임시로 무작위 색 하나 줄어듭니다.
  ExtraDescription1: |-
    {ActiveCostIcon}손에 있는 카드 1장을 선택합니다. 그 카드의 마나 비용 색이 모두 사라지고 |강화|됩니다.
  UpgradedExtraDescription1: |-
    {ActiveCostIcon}손에 있는 카드 1장을 선택합니다. 그 카드의 비용이 임시로 {Mana}가 되고 |강화|됩니다.
  ExtraDescription3: |-
    {UltimateCostIcon}|전장|의 카드 {Value3}장을 선택해 손에 넣습니다. 이 카드들의 비용은 이번 전투 동안 {Mana}가 되며, 이번 전투 동안 {PlayerName}는 |해방| 비용을 지불하지 않습니다.
  DetailText: |-
    패시브 효과는 마나 비용이 0인 카드는 절대 선택하지 않습니다.

