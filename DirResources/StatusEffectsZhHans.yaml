#Keywords

KomachiDistanceKeyword:
  Name: 距离
  Brief: |-
    |距离| 是施加于敌人的状态效果，代表其与玩家的接近程度。
    敌人越近，造成和受到的伤害越多。越远，造成和受到的伤害越少。

    共有 5 个距离等级（若未施加状态则默认为 3）：
    - 极近（1）：造成和受到的攻击伤害 +100%。
    - 近（2）：造成和受到的攻击伤害 +50%。
    - 普通（3）：无伤害修正（默认）。
    - 远（4）：造成和受到的攻击伤害 -15%。
    - 极远（5）：造成和受到的攻击伤害 -30%。

KomachiDisplacementKeyword:
  Name: 位移 X
  Brief: |-
    将目标的当前 |距离| 改变 X。没有 |距离| 的敌人的 |距离| 视为 3。
    任何改变敌人 |距离| 的行为都被视为 |位移|。

KomachiDetonationKeyword:
  Name: 引爆
  Brief: |-
    从敌人身上移除 |怨灵|，对其造成对应伤害。

KomachiModReleaseKeyword:
  Name: 解放 X
  Brief: |-
    在打出此牌时，从 {PlayerName} 身上移除 X 层|引导灵|和/或|神灵|，以选择性地激活此效果。
    优先消耗|引导灵|。
    你必须在打出此牌前拥有所需数量的灵。

KomachiAutoDiscardKeyword:
  Name: 自动弃牌
  Brief: |-
    当你即将超过手牌上限时，|丢弃| 此牌。
    手牌中最左侧带有 |自动丢弃| 的牌会优先被|丢弃|。
    |自动放逐| 牌会先于 |自动丢弃| 牌处理。
# Fixed Auto discard so that it works exactly like auto exile.