    |Liberar| {releaseCost2}: Inflige {Damage2} de daño |Certero| {attackTimes} veces a cada enemigo, luego aplica {Value2} |Espíritus vengativos| a cada enemigo.
  ExtraDescription3: |-
    Este ataque se vuelve |Certero|.
  ExtraDescription4: |-
    Aplica {Value1} |Espíritus vengativos| más a cada enemigo.
  FlavorText: |-
