  Description: |-
    Gana {Block} de |Bloqueo|.
    Por cada enemigo cuya |Distancia| sea {Value1} o más, agrega un |Manipular Distancia| a la mano.

KomachiModWorkFocus:
  Name: Enfocarse en el trabajo
  Description: |-
    |Exilia| hasta {Value1} cartas de la mano, agrega esa misma cantidad de |Manipular distancia| a la mano.
    Si una carta |mejorada| fue exiliada de esta manera, agrega un |Lirio de araña| a tu mano.
  UpgradedDescription: |-
    |Exilia| hasta {Value1} cartas de la mano, pila de robo y pila de descarte, agrega esa misma cantidad de |Manipular distancia| a la mano.
    Si una carta |mejorada| fue exiliada de esta manera, agrega un |Lirio de araña| a tu mano.

KomachiModSpySpirit:
  Name: Espíritu espía acompañante
  Description: |-
    Inflige {Damage} de daño. 
    Siempre que un enemigo es |Desplazado|, gana {Value1} de |Barrera|.
  FlavorText: |-
    Un becario no remunerado. Al menos disfruta del trabajo.

KomachiModSliceOfHigan:
  Name: Corte del Higan
  Description: |-
    Inflige {Damage} de daño {Value1} veces.
    |Mientras esté en la mano|: Siempre que un enemigo sea |Desplazado|, aumenta el daño de {SelfName} en {Value2} en este combate por cada nivel de distancia cambiado.

KomachiModEqualizeDistance:
  Name: Ecualizar la distancia
  Description: |-
    |Desplaza| hasta que la distancia sea {three}.
    Roba {Value1:plural one='% carta' other='% cartas'} por cada nivel desplazado. 
    Si la distancia del objetivo ya era |3|, roba {Value2} cartas, luego descarta {Value3} cartas en su lugar.

KomachiModRitualOfEcstasy:
  Name: Rito de éxtasis
  Description: |-
    Invierte la |Distancia| del objetivo y luego aplica 1 de los siguientes efectos.
    Si la distancia del objetivo es {three}, puedes elegir el efecto en su lugar.
    Si la distancia se redujo, roba {Value1} cartas. Si se incremento, gana {Value2} evasión y {Block} de bloqueo.
  ExtraDescription1: |-
    Roba {Value1} cartas.
  ExtraDescription2: |-
    Gana {Value2} de evasión y {Block} bloqueo.
  DetailText: |-
    Invierte la distancia alrededor del nivel 3.
    Es decir, así irán los desplazamientos:
    - Nivel 1: Desplazado al nivel 5.
    - Nivel 2: Desplazado al nivel 4.
    - Nivel 3: Sin cambios.
    - Nivel 4: Desplazado al nivel 2.
    - Nivel 5: Desplazado al nivel 1.

KomachiModExchangeLife:
  Name: Intercambio de vida
  Description: |-
    Si la |Vida actual| del objetivo es igual o menor que tu |Vida máxima| actual, intercambia sus vidas actuales.
    Si se juega {SelfName} para curar a {PlayerName}, se retira del combate y de la biblioteca.
    |Overflow|: Gana {PlentifulMana}.
  DetailText: |-
    El que tiene la vida inferior se cura, el que tiene la vida superior pierde vida.
    {SelfName} no se puede generar aleatoriamente en combate y no se puede copiar.
  
KomachiModGrudgingStrike:
