  UpgradedDescription: |-
    Desplaza hasta -{Value1}.
    Gana {Value2} de |Evasión| por cada enemigo cuya |Distancia| sea 1 o 2.

KomachiModRetreatBoat:
  Name: Barco protector del Sanzu
  Description: |-
    |Desplaza| en +{Value1}.
    Gana {Block} de |Bloqueo|.
