# Findable cards
KomachiModShootAndMove:
  Name: Dispara y muévete
  Description: |-
    Inflige {Damage} de daño. 
    Puedes |Desplazar| en +/-{Value1}.
  UpgradedDescription: |-
    Inflige {Damage} de daño. 
    Puedes |Desplazar| hasta +/-{Value1}.
  FlavorText: |-
    This was an earlier version of Move and shoot. Switched up because move and shoot lets act1 komachi be less defensive. Undraftable ingame.


KomachiModMoveAndShoot:
  Name: Muévete y dispara
  Description: |-
    Puedes |Desplazar| en +/-{Value1}.
    Inflige {Damage} de daño. 
  UpgradedDescription: |-
    Puedes |Desplazar| hasta +/-{Value1}.
    Inflige {Damage} de daño. 
  NonbattleBaseDescription: |-
    Puedes |Desplazar| en +/-{Value1}.
    Inflige {Damage} de daño.
  UpgradedNonbattleBaseDescription: |-
    Puedes |Desplazar| hasta +/-{Value1}.
    Inflige {Damage} de daño.
  ExtraDescription1: |-
    Inflige VALUE de daño.
  FlavorText: |-
    "Muévete y te disparo! 
    Uh... metí la pata.
    Quiero decir, dispara y me muevo. Ahora mismo.
    (En realidad no lo digo en serio)"

KomachiModRetreat:
  Name: Retiro práctico
  Description: |-
    Puedes |Desplazar| en +{Value1}.
    Gana {Block} de |Bloqueo|.
    Si la |Distancia| es {Value3}, agrega un |Manipular distancia| a la mano.
  UpgradedDescription: |-
    Puedes |Desplazar| en +{Value1}. Luego, puedes |Desplazar| a todos los demás enemigos en +{Value2}.
    Gana {Block} de |Bloqueo|.
    Si la |Distancia| es {Value3}, agrega un |Manipular distancia| a la mano.
  ExtraDescription1: No desplaza el objetivo.
  ExtraDescription2: No desplazas a otros enemigos.
  FlavorText: |-
    Asegúrate de practicar el distanciamiento social.

KomachiModEndlessWay:
  Name: Camino sin fin
  Description: |-
    |Desplaza| en +{Value1}. Remueve toda la |Evasión| del objetivo.
    Gana {Block} de |Bloqueo|.
    |Libera| {Value2} o {Value3}: Aplica {lockOnAmount} |Marcado| por cada {Value2} espiritus liberados.
  ExtraDescription1: |-
    |Libera| {Value2}: Aplica {lockOnAmount} |Marcado|.
  ExtraDescription2: |-
    |Libera| {Value3}: Aplica {lockOnAmount2} |Marcado|.
  FlavorText: |-
    Asegúrate de evitar las máquinas de movimiento perpetuo.

KomachiModSweep:
  Name: Guadaña arrolladora
  Description: |-
    |Desplaza| a cada enemigo en -{Value1}.
    Inflige {Damage} de daño a cada enemigo. 
    Agrega {Value2:plural one='un |Manipular distancia|' other='% |Manipular distancias|'} a la mano.
  FlavorText: |-
    ¡Barrido!

KomachiModDistanceTax:
  Name: Impuestos a la Distancia
  Description: |-
    Aplica lo siguiente efectos a cada enemigo, dependiendo de su |Distancia|:
    1-2: {Value1} de |Debil|.
    3: {Value2} de |Marcado| y |Reducción de poder temporal|.
    4-5: {Value3} de |Vulnerable|.
  FlavorText: |-
    La muerte y los impuestos son inevitables, pero el Ministerio cobra un extra por el envío y la gestión.

KomachiModTasteOfDeath:
  Name: Sabor de la muerte
  Description: |-
    |Desplaza| en -{Value1}.
    Inflige {Damage} de daño.
  FlavorText: |-
    Es un gusto adquirido. Normalmente, la gente solo lo prueba una vez.

KomachiModPushDraw:
  Name: Retroceso y Robo
  Description: |-
    Puedes |Desplazar| en +{Value1}.
    Roba cartas igual a la |Distancia| de ese enemigo.
  UpgradedDescription: |-
    Puedes |Desplazar| hasta +{Value1}.
    Roba cartas igual a la |Distancia| de ese enemigo.
  ExtraDescription1: "No puedes |Desplazar|."
  FlavorText: |-
    Me doy cuenta de que alejarme de la situación me ayuda mucho a sacar mejores conclusiones.

KomachiModQuickNap:
  Name: Siesta rápida
  Description: |-
    Cura {Value1} de vida. 
    Al comienzo del próximo turno de {PlayerName}, gana {Mana}.
    Finaliza el turno de {PlayerName}.
  FlavorText: |-
      Zzz...

KomachiModDistanceAttack:
  Name: Guadaña de la segadora
  Description: |-
    Inflige {Damage} de daño. 
    Siempre que se cambie la |Distancia| de un enemigo, regresa {SelfName} desde la pila de descarte a la mano.
  FlavorText: |-
      Combo en el suelo seguido de 236B. Combo aereo seguido de 236B. Presión en la esquina seguido de 236B. Una larga siesta seguido de 236B.

KomachiModScytheFinalJudgment:
  Name: Guadaña del juicio final
  Description: |-
    |Desplaza| a cualquier distancia.
    Inflige {Damage} de daño a cada enemigo. El daño reducido por distancia se convierte en el doble de daño para esta carta.
    Cuando un enemigo es derrotado por {SelfName}, agrega un |Lirio de araña| a la mano.
  UpgradedDescription: |-
    |Desplaza| a cualquier distancia.
    Inflige {Damage} de daño a cada enemigo. El daño reducido por distancia se convierte en el doble de daño para esta carta.
    Cuando un enemigo es derrotado por {SelfName}, agrega un |Lirio de araña| a la mano. 
  ExtraDescription1: |-
    Inflige VALUE de daño a este enemigo.
  DetailText: |-
    El daño de esta carta aumentará en un 30% y un 60% para las distancias 4 y 5 respectivamente.
    El daño se calculará por separado para cada enemigo.
  FlavorText: |-
    "Los días que la señorita Eiki está enferma, tengo que hacer de juez, jurado y verdugo. ¡Es una verdadera molestia para mi horario de <s>sueño</s>! ¡Ni siquiera me pagan por el extra!"

KomachiModShinigamiFinesse:
  Name: La elegancia de la shinigami
  Description: |-
   Inflige {Damage} de daño {attackAmount} {attackAmount:plural one='vez' other='veces'}.
   La cantidad de veces que esta carta ataca es igual al nivel de distancia del objetivo.
   Si la distancia del objetivo <b>es menor<b> a {three}, este ataque se vuelve |Certero|.
  UpgradedDescription: |-
   Inflige {Damage} de daño {attackAmount} {attackAmount:plural one='vez' other='veces'}.
   La cantidad de veces que esta carta ataca es igual al nivel de distancia del objetivo +1.
   Si la distancia del objetivo <b>es menor</b> a {three}, este ataque se vuelve |Certero|.

KomachiModDistanceBlock:
  Name: Horario de trabajo flexible
  Description: |-
    Cada vez que un enemigo es |Desplazado|, gana {Value1} de |Bloqueo| por cada nivel de distancia modificado.
  FlavorText: |-
    "Trabajar de 9 a 5 no está tan mal cuando puedes echarte una siesta durante la mayor parte del tiempo."

KomachiModDistanceGenerator:
  Name: Esfuerzo del shinigami
  Description: |-
    Al comienzo del turno de {PlayerName}, si no hay |Manipular distancias| en la mano, agrega {Value1} |Manipular distancia| a la mano.
  UpgradedDescription: |-
    Agrega un |Manipular Distancias| a la mano.
    Al comienzo del turno de {PlayerName}, si no hay |Manipular distancias| en la mano, agrega {Value1} |Manipular distancia| a la mano.

KomachiModDistanceFlow:
  Name: Flujo del río Sanzu
  Description: |-
    Cada vez que un enemigo es |Desplazado|:
    - Si se incremento la distancia, gana {Value1} |Espiritu temporal|
    - Si se redujo la distancia, gana {Value1} |Poder temporal|
  FlavorText: |-
    Si ves dos peces peleando en el agua, puedes estar seguro de que una taoísta pasó por allí hace cinco minutos.

KomachiModPushNPull:
  Name: Empujar y tirar
  Description: |-
    Al comienzo del turno de {PlayerName}, se |Desplaza| a cada enemigo en -{Value1}.
    Al final del turno de {PlayerName}, se |Desplaza| a cada enemigo en {Value1}.
  UpgradedDescription: |-
    Agrega un |Manipular Distancias| a la mano.
    Al comienzo del turno de {PlayerName}, se |Desplaza| a cada enemigo en -{Value1}.
    Al final del turno de {PlayerName}, se |Desplaza| a cada enemigo en {Value1}.

KomachiModReviveCard:
  Name: Diosa de la muerte
  Description: |-
    La próxima vez que {PlayerName} sea derrotado en este combate, se curará a la mitad de su vida máxima y gana {Value2} de |Perfección| en su lugar.
    Se remueve {SelfName} de la biblioteca al activarse. Solo se puede revivir una vez por combate con este efecto.
    Al derrotar a un enemigo, si fue una invocación, gana {Value1} de |Barrera|. De lo contrario, cura {Value1} de vida.
  DetailText: |-
    {SelfName} no se puede generar aleatoriamente en combate y no se puede copiar.
    Sólo el primer {SelfName} jugado será eliminado de la biblioteca.

KomachiModRiversideGarden:
  Name: Jardin de la ribera
  Description: |-
    Agrega {Value1} |Lirio de Araña| a la mano, pila de robo,y pila de descarte.
    Siempre que {PlayerName} agregue |Lirios de araña| durante este combate, se |Mejora|.
    Al final del combate, cura {Value2} de vida por cada |Lirio de araña| en el |Campo de batalla|. (hasta la vida actual de {PlayerName} + {maxHeal}).

KomachiModShinigamiTactics:
  Name: Tácticas de shinigami
  Description: |-
    Siempre que se juegue |Manipular distancias| si redujo la distancia, agrega una carta de ataque aleatoria a la mano. Si incrementa la distancia, agrega una carta de defensa aleatoria a la mano.
    Su reduce su |coste temporalmente| a {Mana} y tiene |Exilio| y |Etéreo|.
    Agrega {Value2} |Manipular distancias| a la mano.

KomachiModLowTierShinigami:
  Name: Tier bajo shinigami
  Description: |-
    Inflige {Damage} de daño.
    Aplica {Value1} de |Vulnerable|.
  FlavorText: "¿Cuántas veces tengo que decirlo? A nadie le va a importar si te suicidas."

KomachiModWeedCutter:
  Name: Cortadora de malezas
  Description: |-
    Inflige {Damage} de daño. 
    Roba {Value1} carta.
    Agrega un |Manipular distancias| a la mano.
  FlavorText: "Si tratas a tus enemigos como plantas, las guadañas dejan de ser armas poco prácticas."

KomachiModParry:
  Name: Parada de guadaña
  Description: |-
