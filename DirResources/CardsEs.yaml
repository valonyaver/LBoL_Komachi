    Roba {Value1} cartas.
  ExtraDescription2: |-
    Gana {Value2} de evasión y {Block} bloqueo.
  DetailText: |-
    Invierte la distancia alrededor del nivel 3.
    Es decir, así irán los desplazamientos:
    - Nivel 1: Desplazado al nivel 5.
    - Nivel 2: Desplazado al nivel 4.
    - Nivel 3: Sin cambios.
    - Nivel 4: Desplazado al nivel 2.
    - Nivel 5: Desplazado al nivel 1.

