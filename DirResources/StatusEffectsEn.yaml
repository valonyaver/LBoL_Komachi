KomachiModDistanceSe:
  Name: "Distance {Level}: {DistanceString}"
  Description: Attack Damage inflicted and received by this unit is {MultiplierDescription}.

KomachiModDistanceBlockSe:
  Name: Flexible Work Schedule
  Description: Each time an enemy's Distance is changed, gain {Level} |Block| for every unit of change.

KomachiModDistanceGeneratorSe:
  Name: Hardworking Shinigami
  Description: 'At the start of {PlayerName}''s turn, if there are {Level:plural one=''no''
    other=''less than %''} |Manipulate Distance| in the hand, add {Level:plural one=''a |Manipulate Distance|
    '' other=''|Manipulate Distances|''} to the hand{Level:plural one=''.'' other='' until
    there are %.''}'
  Brief: 'At the start of {PlayerName}''s turn, if there''s less than a number of
    |Manipulate Distance| in the hand, add |Manipulate Distances| to the hand until there are that many.'

KomachiModDistanceFlowSe:
  Name: Flow of the Sanzu River
  Description: |-
    Each time an enemy is |Displaced|:
    - If the Distance change was positive, gain {Level} |Temporary Spirit Up|
    - If the Distance change was negative, gain {Level} |Temporary Firepower Up|

KomachiModReviveSe:
  Name: God of Death
  Description: |-
    The next {Count} time {PlayerName} would be defeated this combat, heal to half the maximum HP and gain {flawlessTurns} |Flawless| instead.
    Remove {SelfName} from your Library when this is applied.
    Whenever an enemy is defeated, if it was a summon, gain {Level} |Barrier|. Otherwise, gain {Level} life.

KomachiModPushNPullSe:
  Name: Push and Pull
  Description: |-
    At the start of {PlayerName}'s turn, |Displace| all enemies by -{Level}.
    At the end of {PlayerName}'s turn, |Displace| all enemies by {Level}.

KomachiModSpySpiritSe:
  Name: Spy Spirit
  Description: |-
    When {OwnerName}'s |Distance| is changed, {PlayerName} gains {Level} |Barrier|.

KomachiModRiversideGardenSe:
  Name: Riverside Garden
  Description: |-
    Whenever {PlayerName} adds |Spider Lily| during this combat, |Upgrade| it.
    At the end of combat, gain {Level} life for every |Spider Lily| on the |battlefield|.

KomachiModShinigamiTacticsSe:
  Name: Shinigami Tactics
  Description: |-
    Whenever |Manipulate Distance| is played: 
    - If it reduced distance, add {Level} random attack card{Level:plural one='' other='s'} to the hand. 
    - If it increased distance, add {Level} random defence card{Level:plural one='' other='s'} to the hand.
    {Level:plural one='It |temporarily costs|' other='They |temporarily cost|'} {Mana}, ha{Level:plural one='s' other='ve'} |Exile| and |Ethereal|.

KomachiModBWBridgeSe:
  Name: Ministry Work
  Description: At the start of {PlayerName}'s turn, gain {Level} {Mana}.
  Brief: At the start of {PlayerName}'s turn, gain {Mana}.

KomachiModVengefulSpiritSe:
  Name: Vengeful Spirits
  Description: |-
    At the start of {OwnerName}'s turn, reduce duration of {SelfName} by 1.
    After {Duration} turns, remove {SelfName} and deal double its count as |Accurate| attack damage. 
    {damageDealt} damage will be dealt.
  Brief: |-
    At the start of the turn, reduce duration of {SelfName} by 1.
    When this status effect is removed, deal double its current count as |Accurate| attack damage to its owner.
    Note: This attack damage is affected by damage modifiers on both the enemy and player.

KomachiModGuidedSpiritSe:
  Name: Guided Spirits
  Description: |-
    At the end of {PlayerName}'s Turn, deal {damageDealt} |Accurate| attack damage to the enemy with the lowest life ({targetName}), then lose 1 {SelfName}.
  Brief: |-
    At the end of {PlayerName}'s Turn, deal |Accurate| damage to the enemy with the lowest life equal to {SelfName}'s level, then lose 1 {SelfName}.

KomachiModDivineSpiritSe:
  Name: Divine Spirits
  Description: |-
    At the end of {PlayerName}'s turn, gain {Level} |Barrier|, then halve the level of {SelfName}, rounding down.
  Brief: |-
    At the end of its owner's turn, that unit gains |Barrier| equal to {SelfName}'s level, then halve the level of {SelfName}, rounding down.

KomachiModBoundSpiritsOfEarthSe:
  Name: Bound Spirits of the Earth
  Description: |-
    At the end of {PlayerName}'s turn, apply {Level} |Vengeful Spirits| to each enemy that has |Vengeful Spirits|.

KomachiModLonelyBoundSpiritSe:
  Name: Lonely Bound Spirit
  Description: |-
    Whenever |Vengeful Spirits| are applied on {OwnerName}, increase the count of |Lonely Bound Spirit| by the same amount * {Level}. 
    |Lonely Bound Spirit| will only be detonated when |Vengeful Spirits| are detonated on {OwnerName} with a card effect, dealing {damageDealt} damage.
  Brief: |-
    Whenever |Vengeful Spirits| are applied on its owner, increase the count of |Lonely Bound Spirit| by the same amount. 
    |Lonely Bound Spirit| will only be detonated when |Vengeful Spirits| are |Detonated| on its owner with a card effect.
    If |Lonely Bound Spirit| is detonated at the same time as |Vengeful Spirits|, effects that count the amount of spirits detonated will count both.

KomachiModDetonateFirepowerSe:
  Name: Grudge of the dead.
  Description: |-
    Each time |Vengeful Spirits| are |Detonated|, gain {Level} |Firepower|.

KomachiModTalkativeFerrymanSe:
  Name: Talkative Ferryman
  Description: |-
    At the start of {PlayerName}'s turn, gain {Level} |Guided Spirits|.

KomachiModGuidedGeneratorNextTurnSe:
  Name: Gain Guided Spirits
  Description: |-
    At the start of {PlayerName}'s next turn, gain {Level} |Guided Spirits|.

KomachiModDetonateInfiniteSe:
  Name: Forever Cancelled
  Description: |-
    Each time |Vengeful Spirits| is |Detonated|, apply {Level} |Vengeful Spirits| on that target.

KomachiModSpiritReturnSe:
  Name: Spirit Return
  Description: |-
    At the start of {PlayerName}'s turn, place the {Level} rightmost card{Level:plural one='' other='s'} in the hand at the bottom of the deck, then add up to {Level} card{Level:plural one='' other='s'} from the |Exile| pile with a total cost less than 2 to your hand. It costs {Mana} more and is removed from combat when played.

KomachiModEthicallySourcedBreakSe:
  Name: Ethically Sourced Break
  Description: |-
    At the start of {PlayerName}'s next turn, skip {PlayerName}'s turn.
    At the start of {PlayerName}'s next turn after that, gain {manaAmount} and draw {Count} cards.

KomachiModInfernoTempestSe:
  Name: Souls at the end of the Road
  Description: |-
    At the start of {PlayerName}'s next turn, choose up to {Value2} non Basic exiled cards. Add them randomly amongst your hand, draw pile, and discard pile.
    
KomachiModHellFreezeSe:
  Name: Hell's Frozen Warmth
  Description: |-
    Each time |Vengeful Spirits| are |Detonated| on {OwnerName}, apply |Cold| to {OwnerName}. (This effect does not stack)

KomachiModMidsummerLilySe:
  Name: Lonesome Lily
  Description: |-
    After {PlayerName} plays a |Spider Lily|, add {Level} |Midsummer Flower{Level:plural one='' other='s'}| to the hand.

KomachiModLifespanEndSe:
  Name: Lifespans's End
  Description: |-
    At the end of {PlayerName}'s turn: Take {Level} damage.

KomachiModGoldSarcophagusSe:
  Name: Gold Sarcopha-Galley
  Description: |-
    At the start of {PlayerName}'s turn, reduce the duration of each card in the {SelfName}. When the duration of a card becomes {returnTime}, add it to {PlayerName}'s hand.
    Cards in the {SelfName}: {SarcophagusContent}

KomachiModExileDoppelgangerSe:
  Name: Extinct Fauna of the Sanzu River
  Description: |-
    Whenever {PlayerName} plays a card:
    - |If a card with the same name is not in the Exile pile|: Add a |Copy| of it to the exile pile. It costs {Mana} and is removed from combat after being played. (You can use this {Count} more time{Count:plural one='' other='s'} this turn.)
    - |If a card with the same name is in the Exile pile|: You can add it to your hand. (You can use this {count2} more time{count2:plural one='' other='s'} this turn.)
    You can only use each effect of {SelfName} {Level:ordinal one='once' two='twice' few='thrice' other='% times'} per turn.

KomachiModEikiSe:
  Name: Lectured Shinigami
  Description: |-
    {PlayerName} does not pay the |Release| cost of cards.
#Keywords

KomachiDistanceKeyword:
  Name: Distance
  Brief: |-
    Distance is a status effect applied to enemies, representing their proximity to the player.
    The closer an enemy is, the more damage they deal and take. The farther they are, the less damage they deal and take.

    There are 5 Distance levels (default is 3 if no status is applied):
    - Very Close (1): Deals and takes +100% attack damage.
    - Close (2): Deals and takes +50% attack damage.
    - Normal (3): No damage modifier (default).
    - Far (4): Deals and takes -15% attack damage.
    - Very Far (5): Deals and takes -30% attack damage.

KomachiDisplacementKeyword:
  Name: Displace X
  Brief: |-
    Change the current |Distance| of the target by X. Enemies with no distance have their distance treated as 3.
    Displacement also refers generally to any instance of changing distance of an enemy.

KomachiDetonationKeyword:
  Name: Detonate
  Brief: |-
    Remove |Vengeful Spirits| from the enemy, dealing their damage to that enemy.

KomachiModReleaseKeyword:
  Name: Release X
  Brief: |-
    Remove X amount of |Guided Spirits| and/or |Divine Spirits| from {PlayerName} when playing* this card to optionally activate this effect.
    |Guided Spirits| are prioritized first.
    *You must have the required amount before playing the card.