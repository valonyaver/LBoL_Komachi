KomachiModEiki:
  Name: Eiki Shiki, Supreme Judge of Paradise
  Description: |-
    {Indent}Gain {RawShield} |Divine Spirits|.
    {PassiveCostIcon}Choose {Value1} random card{Value1:plural one='' other='s'} from the hand: |If it's a Misfortune or Status card|: |Exile| it, then gain {Value2} |Guided Spirits|. 
    |Otherwise|: Gain |Guided Spirits| equal to its mana cost. It |temporarily costs| 1 random mana less.
  ExtraDescription1: |-
    {ActiveCostIcon}Choose a card in the hand. It |temporarily loses| all its coloured mana cost. |Upgrade| it.
  UpgradedExtraDescription1: |-
    {ActiveCostIcon}Choose a card in the hand. It |temporarily costs| {Mana} |Upgrade| it.
  ExtraDescription3: |-
    {UltimateCostIcon}Choose up to {Value3} card{Value3:plural one='' other='s'} in the |battlefield| and add {Value3:plural one='it' other='them'} to the hand. {Value3:plural one='Its' other='Their'} cost becomes {Mana} this combat. {PlayerName} doesn't pay the |Release| cost of cards this combat.
  DetailText: |-
    The passive effect will never pick a card with 0 mana.
  EikiAltWinChat1: |- # PK
    Okay Okay, Miss- I mean, Esteemed Lady Eiki.
  EikiAltWinChat2: |- # PK
    <size=90%>I understand your point, and I'll work harder! But I promise you that I really am not slacking this time! You're misunderstanding the situation! 
  EikiAltWinChat3: |- # PK
    <size=90%>I didn't steal any of these exhibits! I'm looking for the actual culprit who did, and doing what I can recovering them for Kaguya-Sama!
  EikiAltWinChat4: |- # E
    Hmph! Is that really the case?
  EikiAltWinChat5: |- # E
    Well, I suppose you <i>are</i> properly guiding some spirits during this venture. 
  EikiAltWinChat5.5: |- # E
    (Not just sleeping on your boat for once...)
  EikiAltWinChat6: |- # E
    Fine, I will let you go for now. You are permitted to continue your investigation.
  EikiAltWinChat7: |- # PK
    Yipee! :D
  EikiAltWinChat8: |- # E
    But your backlog of 21 unferried spirits awaits after this. No dozing off.
  EikiAltWinChat9: |- # PK
    Agh- I mean, fine. I'll... promise not to sleep on the job later.


