  UpgradedDescription: |-
    Add a |Manipulate Distance| to your hand.
    At the start of {PlayerName}'s turn, |Displace| all enemies by -{Value1}.
    At the end of {PlayerName}'s turn, |Displace| all enemies by {Value1}.

KomachiModReviveCard:
