# Findable cards
KomachiModShootAndMove:
  Name: Shoot and Move
  Description: |-
    Deal {Damage} damage. 
    You can |Displace| by +/-{Value1}.
  UpgradedDescription: |-
    Deal {Damage} damage. 
    You can |Displace| by up to +/-{Value1}.
  FlavorText: |-
    This was an earlier version of Move and shoot. Switched up because move and shoot lets act1 komachi be less defensive.


KomachiModMoveAndShoot:
  Name: Move and Shoot
  Description: |-
    You can |Displace| by +/-{Value1}.
    Deal {Damage} damage. 
  UpgradedDescription: |-
    You can |Displace| by up to +/-{Value1}.
    Deal {Damage} damage. 
  NonbattleBaseDescription: |-
    You can |Displace| by +/-{Value1}.
    Deal {Damage} damage..
  UpgradedNonbattleBaseDescription: |-
    You can |Displace| by up to +/-{Value1}.
    Deal {Damage} damage..

KomachiModRetreat:
