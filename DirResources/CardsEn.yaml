  Description: |-
    |Displace| by -{Value1}.
    Deal {Damage} damage.

KomachiModPushDraw:
  Name: Pusback Draw
  Description: |-
    You can |Displace| by +{Value1}.
    Draw cards equal to that enemy's |Distance|.
  UpgradedDescription: |-
    You can |Displace| by up +{Value1}.
    Draw cards equal to that enemy's |Distance|.
  ExtraDescription1: "Do not |Displace|."

