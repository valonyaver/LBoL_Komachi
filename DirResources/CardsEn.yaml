KomachiModManDistance:
  Name: Manipulate Distance
  Description: "|Displace| +/-{Value1}."
  UpgradedDescription: "|Displace| by up to +/-{Value2}."
  ExtraDescription1: "|Displace| by -{Value1}." # Remember that card choice indicator is what causes the description to change to one of these 2
  ExtraDescription2: "|Displace| by +{Value1}."
  ExtraDescription3: "|Displace| by -{Value2}." # for some reason these don't work'
  ExtraDescription4: "|Displace| by +{Value2}."

KomachiModManDistance2:
  Name: Manipulate Distance 2
  Description: "|Displace| +/-{Value1}."
  UpgradedDescription: "|Displace| by up to +/-{Value2}."
  ExtraDescription1: "|Displace| by -{Value1}."
  ExtraDescription2: "|Displace| by +{Value1}."

KomachiModManDistance3:
  Name: Manipulate Distance 3
  Description: "|Displace| +/-{Value1}."
  UpgradedDescription: "|Displace| by up to +/-{Value2}."
  ExtraDescription1: "|Displace| by -{Value1}."
  ExtraDescription2: "|Displace| by +{Value1}."

KomachiModSpiderLily:
  Name: Spider Lily
  Description: |-
    Gain {Mana}.
    Gain {Value1} |Temporary Firepower|.
    Gain {Value2} |Poison|.

KomachiModShootAndMove:
  Name: Shoot and Move
  Description: |-
    Deal {Damage} damage. 
    |Displace| by +/-{Value1}.
  UpgradedDescription: |-
    Deal {Damage} damage. 
    |Displace| by up to +/-{Value1}.

KomachiModShootAndMoveNegative:
  Name: Shoot and Move (-)
  Description: |-
    Deal {Damage} damage. 
    |Displace| by {Value1}.

KomachiModRetreat:
  Name: Rowing Retreat
  Description: |-
    |Displace| by +{Value1}.
    Gain {Block} |Block|.
    If the target's |Distance| is {Value3}, add a |Manipulate Distance| to your hand.
  UpgradedDescription: |-
    |Displace| by +{Value1}. Then, |Displace| all other enemies by +{Value2}.
    Gain {Block} |Block|.
    If the target's |Distance| is {Value3}, add a |Manipulate Distance| to your hand.

KomachiModEndlessWay:
  Name: Endless Way
  Description: |-
    |Displace| by +{Value1}. Remove all |Graze| from that target.
    Gain {Block} |Block|.

KomachiModSweep:
  Name: Sweeping Scythe
  Description: |-
    |Displace| each enemy by -{Value1}.
    Deal {Damage} damage to each enemy. 
    Add {Value2:plural one='a |Manipulate Distance|' other='% |Manipulate Distance|'} to the hand.

KomachiModDistanceTax:
  Name: Distance Tax
  Description: |-
    Apply the following to each enemy, depending on its |Distance|:
    1-2: {Value1} |Weak|.
    3: {Value2} |Lock on| and |Temporary Firepower down|.
    4-5: {Value3} |Vulnerable|.

KomachiModTasteOfDeath:
  Name: Taste of Death
  Description: |-
    |Displace| by -{Value1}.
    Deal {Damage} damage.

KomachiModPushDraw:
  Name: Pusback Draw
  Description: |-
    You can |Displace| by +{Value1}.
    Draw cards equal to that enemy's |Distance|.
  UpgradedDescription: |-
    You can |Displace| by up +{Value1}.
    Draw cards equal to that enemy's |Distance|.
  ExtraDescription1: "Do not |Displace|."

KomachiModQuickNap:
  Name: Quick Nap
  Description: |-
    Gain {Value1} life. 
    At the start of {PlayerName}'s next turn, gain {Mana}.
    End {PlayerName}'s turn.

KomachiModDistanceAttack:
  Name: Scythe of the Reaper
  Description: |-
    Deal {Damage} damage. 
    Whenever an enemy's |Distance| is changed, return {SelfName} from the discard pile to the hand.

KomachiModScytheFinalJudgment:
  Name: Scythe of Final Judgement
  Description: |-
    Deal {Damage} damage. Damage reduction of far distances increases this card's damage instead.
    When this card defeats an enemy, add a |Spider Lily| to the hand.
  UpgradedDescription: |-
    Deal {Damage} damage. Damage reduction of far distances increases this card's damage instead.
    When this card defeats an enemy, add a |Spider Lily+| to the hand.

KomachiModShinigamiFinesse:
  Name: Shinigami's Finesse
  Description: |-
   Deal {Damage} damage {attackAmount} {attackAmount:plural one='time' other='times'}.
   The amount of times this card attacks is equal to the distance level of the target.

KomachiModDistanceBlock:
  Name: Flexible Work Schedule
  Description: |-
    Each time an enemy is |Displaced|, gain {Value1} |Block| for each level of distance changed.

KomachiModDistanceGenerator:
  Name: Hardworking Shinigami
  Description: |-
    At the start of {PlayerName}'s turn, if there are no |Manipulate Distances| in the hand, add {Value1} |Manipulate Distance| to your hand.
  UpgradedDescription: |-
    Add 1 |Manipulate DIstance| to your hand.
    At the start of {PlayerName}'s turn, if there are no |Manipulate Distances| in the hand, add {Value1} |Manipulate Distance| to your hand.

KomachiModDistanceFlow:
  Name: Flow of the Sanzu River
  Description: |-
    Each time an enemy is |Displaced|:
    - If the Distance change was positive, gain {Value1} |Temporary Spirit Up|
    - If the Distance change was negative, gain {Value1} |Temporary Firepower Up|

KomachiModPushNPull:
  Name: Push and Pull
  Description: |-
    At the start of {PlayerName}'s turn, |Displace| all enemies by -{Value1}.
    At the end of {PlayerName}'s turn, |Displace| all enemies by {Value1}.
  UpgradedDescription: |-
    Add a |Manipulate Distance| to your hand.
    At the start of {PlayerName}'s turn, |Displace| all enemies by -{Value1}.
    At the end of {PlayerName}'s turn, |Displace| all enemies by {Value1}.

KomachiModReviveCard:
  Name: God of Death
  Description: |-
    The next time {PlayerName} would be defeated this combat, heal to half the maximum HP and gain {Value2} |Flawless| instead.
    Remove {SelfName} from your library when this is applied. You can only revive once with this effect per combat.
    Whenever an enemy is defeated, if it was a summon, gain {Value1} |Barrier|. Otherwise, gain {Value1} life.
  DetailText: "{SelfName} cannot be randomly generated in combat, and cannot be copied."

KomachiModRiversideGarden:
  Name: Riverside Garden
  Description: |-
    Add {Value1} |Spider Lily| to the hand, draw pile, and discard pile.
    Whenever {PlayerName} adds |Spider Lily| during this combat, |Upgrade| it.
    At the end of combat, gain {Value2} life for every |Spider Lily| on the |battlefield|.

KomachiModShinigamiTactics:
  Name: Shinigami Tactics
  Description: |-
    Whenever |Manipulate Distance| is played, if it reduced distance, add a random attack card to the hand. If it increased distance, add a random defence card to the hand.
    It |temporarily costs| {Mana}, has |Exile| and |Ethereal|.
    Add {Value2} |Manipulate Distance| to the hand.
  DetailText: Cards whose original cost is 0 won't have their cost changed.

KomachiModLowTierShinigami:
  Name: Low Tier Shinigami
  Description: |-
    Deal {Damage} damage.
    Apply {Value1} |Vulnerable|.
  FlavorText: "How many times do I have to say it? Nobody is going to care if you commit suicide."

KomachiModWeedCutter:
  Name: Weed Cutter
  Description: |-
    Deal {Damage} damage. 
    Draw {Value1} card.
    Add a |Manipulate Distance| to your hand.

KomachiModParry:
  Name: Scythe Parry
  Description: |-
    Gain {Block} |Block|.
    Gain {Value1} |Reflection|.
    Add a |Manipulate Distance| to your hand.

KomachiModCoinThrow:
  Name: Coin Throw
  Description: |-
    Deal {Damage} damage to each enemy.
    Lose {Value1} <sprite="Point" name="Gold">.

KomachiModIgnoreNagging:
  Name: Ignore Nagging
  Description: |-
    Displace by -{Value1}.
    Gain {Value2} |Graze| for each enemy whose |Distance| is 1 or 2.
  UpgradedDescription: |-
    Displace by up to -{Value1}.
    Gain {Value2} |Graze| for each enemy whose |Distance| is 1 or 2.

KomachiModRetreatBoat:
  Name: Retreating Sanzu Boat
  Description: |-
    |Displace| by +{Value1}.
    Gain {Block} |Block|.
    Gain {Value2} |Barrier| times that target's |Distance|.

KomachiModManipDefence:
  Name: Moving Defence
  Description: |-
    Gain {Block} |Block|.
    For each enemy whose |Distance| is {Value1} or more, add a |Manipulate Distance| to hand.

KomachiModWorkFocus:
  Name: Work Focus
  Description: |-
    |Exile| up to {Value1} cards from the hand; add that many |Manipulate Distances| to your hand.
    If an upgraded card was exiled this way, add a |Spider Lily| to your hand.
  UpgradedDescription: |-
    |Exile| up to {Value1} cards from the hand, draw pile, and discard pile; add that many |Manipulate Distances| to your hand.
    If an upgraded card was exiled this way, add a |Spider Lily| to your hand.

KomachiModSpySpirit:
  Name: Accompanying Spy Spirit
  Description: |-
    Deal {Damage} damage. 
    Whenever that enemy is |Displaced|, gain {Value1} |Barrier|.

KomachiModSliceOfHigan:
  Name: Slice of Higan
  Description: |-
    Deal {Damage} damage {Value1} times.
    |While in hand|: Whenever an enemy is |Displaced|, increase {SelfName}'s damage by {Value2} this combat for each distance level changed.

KomachiModEqualizeDistance:
  Name: Equalize Distance
  Description: |-
    |Displace| until distance is |3|.
    Draw {Value1:plural one='% card' other='% cards'} for each level displaced. 
    If target's distance was already |3|, draw {Value2} cards, then discard {Value3} cards instead.

KomachiModRitualOfEcstasy:
  Name: Ritual of Ecstasy
  Description: |-
    Invert target's |Distance|.
    If the distance was reduced, draw {Value1} cards. Otherwise, gain {Value2} graze and {Block} block.
  DetailText: |-
    Inverts distance around level 3.
    That is, this is how the displacements will go:
    - Level 1: Displaced to level 5.
    - Level 2: Displaced to level 4.
    - Level 3: No change.
    - Level 4: Displced to Level 2.
    - Level 5: Displaced to level 1.

KomachiModExchangeLife:
  Name: Exchange Life
  Description: |-
    If the target's |Current Life| is equal to or lower than your current |Maximum Life|, switch your current lives.
    If {SelfName} is played to heal {PlayerName}, it is removed from combat and from the library.
  DetailText: |-
    The one with lower life is healed, the one with higher life loses life.
    {SelfName} cannot be randomly generated in combat, and cannot be copied.
  
KomachiModGrudgingStrike:
  Name: Grudging Strike
  Description: |-
    Deal {Damage} damage.
    Apply {Value1} |Vengeful Spirits|.

KomachiModDefendDetonate:
  Name: No hard feelings
  Description: |-
    Gain {Block} |Block|.
    You can |Detonate| the target, and if you do, apply {Value2} |Temporary Firepower Down| for every {Value3} |Vengeful Spirits| that target had.
  UpgradedDescription: |-
    Gain {Block} |Block|.
    Apply {Value1} |Vengeful Spirits|.
    You can |Detonate| the target, and if you do, apply {Value2} |Temporary Firepower Down| for every {Value3} |Vengeful Spirits| that target had.
  ExtraDescription1: "Do not |Detonate|"
  ExtraDescription2: "|Detonate|"

KomachiModBWBridge:
  Name: Ministry Work
  Description: |-
    Gain {Mana}. At the start of {PlayerName}'s turn, gain {Mana}.
    Choose up to {Value1} of {Value2} random White/Black hybrid cards to add to the hand.
  UpgradedDescription: |-
    Gain {Mana}. Add |Radiance| to your hand.
    At the start of {PlayerName}'s turn, gain {Mana}.
    Choose up to {Value1} of {Value2} random White/Black hybrid cards to add to the hand.
  DetailText: |-
    These |e:alternate cards| ignore total mana and mana color restrictions.

KomachiModFishing:
  Name: Double Hooking
  Description: |-
    Discard {Value1} card, then target up to {Value2} cards in |Exile| whose total cost is less than {Value3} each; Return them to the hand.
    They |temporarily cost| {Mana}.

KomachiModGuidingSanzu:
  Name: Guiding Sanzu
  Description: |-
    Gain {Value1} |Guiding Spirits|.

KomachiModBoomBenefits:
  Name: Boom Benefits
  Description: |-
    |Detonate| an Enemy, then |Choose|:
    - Gain 1 Guided Spirit for every {Value1} detonated |Vengeful Spirit|.
    - Draw 1 card for every {Value2} detonated |Vengeful Spirit|.
  ExtraDescription1: Gain 1 Guided Spirit for every {Value1} detonated |Vengeful Spirit|.
  ExtraDescription2: Draw 1 card for every {Value2} detonated |Vengeful Spirit|.

KomachiModShootGhosts:
  Name: Shoot Ghosts
  Description: |-
    Deal {Damage} damage. {SelfName} deals {Value1} more damage for every |Vengeful Spirit| on the target.

KomachiModSpiritDefence:
  Name: Ghosts follow You
  Description: |-
    Gain {Block} block.
    Gain {Value1} |Guiding Spirits|.

KomachiModVengefulSweep:
  Name: Horror movie showing
  Description: |-
    Inflict {Value1} |Vengeful Spirits| on all enemies.
    |Release| {Value2}: Inflict {Value1} more |Vengeful Spirits| on all those enemies.

KomachiModFreeTrauma:
  Name: Free Trauma?!
  Description: |-
    Inflict {Value3} |Vengeful Spirit|.
    Gain {Mana}.
    |Release| {Value1} or {Value2}: Gain an Additional {Mana} for every {Value1} Spirits released.

KomachiModVengefulerSweep:
  Name: Horrorer movie showing
  Description: |-
    Deal {Damage} damage to each enemy.
    Apply {Value1} |Vengeful Spirits| to each enemy.
    |Release| {Value2}: This becomes |Accurate|.

    
