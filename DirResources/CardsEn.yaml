  Description: |-
    Deal {Damage} damage. Deals double damage if the enemy has |Barrier| or |Block|. Damage reduction of far distances increases this card's damage instead.
    When an enemy is defeated using {SelfName}, add a |Spider Lily| to the hand.
  UpgradedDescription: |-
    Deal {Damage} damage. Deals double damage if the enemy has |Barrier| or |Block|. Damage reduction of far distances increases this card's damage instead.
    When an enemy is defeated using {SelfName}, add 2 |Spider Lilies| to the hand.

