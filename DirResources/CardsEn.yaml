    If the target's |Distance| is {Value3}, add a |Manipulate Distance| to your hand.
  UpgradedDescription: |-
    You can |Displace| by +{Value1}. Then, you can |Displace| all other enemies by +{Value2}.
    Gain {Block} |Block|.
    If the target's |Distance| is {Value3}, add a |Manipulate Distance| to your hand.
  ExtraDescription1: Do not displace target.
  ExtraDescription2: Do not displace other enemies.

KomachiModEndlessWay:
  Name: Endless Way
  Description: |-
    |Displace| by +{Value1}. Remove all |Graze| from that target.
    Gain {Block} |Block|.
    |Release| {Value2} or {Value3}: Apply {Value1} |Lock on| for every {Value2} Spirits released.
  ExtraDescription1: |-
    |Release| {Value2}: Apply {lockOnAmount} |Lock on|.
  ExtraDescription2: |-
    |Release| {Value3}: Apply {lockOnAmount2} |Lock on|

KomachiModSweep:
  Name: Sweeping Scythe
  Description: |-
    |Displace| each enemy by -{Value1}.
    Deal {Damage} damage to each enemy. 
    Add {Value2:plural one='a |Manipulate Distance|' other='% |Manipulate Distance|'} to the hand.

KomachiModDistanceTax:
  Name: Distance Tax
  Description: |-
    Apply the following to each enemy, depending on its |Distance|:
    1-2: {Value1} |Weak|.
    3: {Value2} |Lock on| and |Temporary Firepower down|.
    4-5: {Value3} |Vulnerable|.

KomachiModTasteOfDeath:
