KomachiMod:
  Name: 'Komachi Onozuka'
  Title: 'Guía del Río Sanzu'
  Move:
  - 'Espíritus Ligados a la Tierra'
  - 'Guadaña de la Segadora'
  - 'Sabor de la Muerte'
  - 'Golpe Indolente'
  - 'Siesta Rápida'
  - 'Impuestos a la Distancia'
  - 'Signo de la Muerte'
  - 'Guadaña del Juicio Fin'
  - 'Last Word - Shinigami'
  - 'Retorno al Higan'
  KomaEscape1: |-
    ¡OK! Esto debería ser suficiente para convencer a Eiki de que hice todo lo posible por detenerte.
  KomaEscape2: |-
    Me voy a echar una <size=50%>buena siesta<size=100%>. Espero que encuentres al culpable a<size=90%>d<size=80%>i<size=70%>ó<size=60%>o<size=50%>o<size=40%>s!
  LastWordChat1: |-
    ¡Gah! ¡Me estás haciendo trabajar demasiado, ¿sabes?
  LastWordChat2: |-
    ¡Pero no puedo tolerar eso!
  EikiMirrorChat1: |-
    <size=85%>¡Cumpliré mis tareas de shinigami con la mayor eficiencia posible y entregaré el informe después del combate para que lo revise, honorable Lady Eiki!
  EikiMirrorChat2: |-
    ¡Oye, yo no sueno así! ¡Nadie en su sano juicio disfruta del papeleo!
  EikiMirrorChat3: |-
    Así es como se comporta un Shinigami como es debido. Quizás deberías tomar nota.
    
